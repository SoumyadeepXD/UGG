name: Deploy UGG Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-version/package-lock.json

      - name: Install dependencies
        run: |
          cd react-version
          npm ci

      - name: Build React application
        run: |
          cd react-version
          npm run build
          cp ../standalone.html dist/standalone.html 2>/dev/null || true
          cp dist/index.html dist/404.html 2>/dev/null || true
          cp ../backend/data/content.json dist/content.json 2>/dev/null || true
          mkdir -p dist/uploads
          cp -r ../backend/uploads/* dist/uploads/ 2>/dev/null || true
          cp -r ../uploads/* dist/uploads/ 2>/dev/null || true
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: react-version/dist
          branch: gh-pages
