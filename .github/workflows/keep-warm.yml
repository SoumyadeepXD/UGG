name: Keep Render Backend Warm

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping UGG Backend on Render
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging UGG Backend on Render to prevent idle spin-down..."
          curl -s -m 45 https://ugg-backend.onrender.com/api/health || echo "Ping dispatched"
