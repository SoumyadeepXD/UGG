<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UGG – UEM Gamerz Guild</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050506;--ink:#fff;--mut:#a9a9b3;--red:#e11d2e;--card:#101014;--line:#26262d;--light:#f3f3f6;--dark-ink:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.hd{font-family:Orbitron,Inter,sans-serif;font-weight:800;line-height:1.12;letter-spacing:.01em}
a{color:inherit;text-decoration:none}
.s{min-height:100vh;min-height:100svh;position:relative;display:flex;flex-direction:column;justify-content:center;padding:96px max(24px,6vw) 48px;overflow:hidden}
.s h2{font-size:clamp(24px,3.6vw,46px);margin-bottom:10px;display:flex;gap:14px;align-items:center}
.s h2:before{content:"";width:14px;height:34px;background:var(--red);transform:skewX(-20deg);flex:none}
.sub{color:var(--mut);margin-bottom:36px;max-width:60ch}
.light{background:var(--light);color:var(--dark-ink)}.light .sub{color:#555}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) max(20px,5vw) 12px;background:rgba(5,5,6,.92);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px}.logo img{height:46px}.logo b{font:900 24px Orbitron;color:var(--red);letter-spacing:.06em}.logo small{display:block;font-size:8px;letter-spacing:.14em;margin-top:-4px}
.links{display:flex;gap:22px}.links a{font-weight:600;font-size:14px;padding:6px 0;border-bottom:2px solid transparent;transition:.25s}.links a.on,.links a:hover{border-color:var(--red)}
.btn{display:inline-flex;gap:8px;align-items:center;padding:12px 22px;border-radius:8px;font-weight:600;border:1.5px solid var(--red);background:transparent;color:inherit;cursor:pointer;font-size:15px;transition:.25s}
.btn.fill{background:var(--red)}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(225,29,46,.35)}.btn.wh{border-color:#fff}
.burger{display:none;background:none;border:0;color:#fff;font-size:26px}
/* hero */
.hero video,.hero canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,6,.9) 10%,rgba(5,5,6,.5) 42%,rgba(5,5,6,.08)),linear-gradient(0deg,var(--bg),transparent 30%)}
.hero>div{position:relative;z-index:2;max-width:880px}
.kick{letter-spacing:.3em;font-size:13px;display:flex;gap:14px;align-items:center;margin-bottom:18px}.kick:after{content:"";width:70px;height:2px;background:var(--red)}
.hero h1{font-size:clamp(32px,5.4vw,76px)}.hero h1 span{display:block;overflow:hidden}.hero h1 i{display:block;transform:translateY(105%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1 span:nth-child(2) i{animation-delay:.18s}
.hero h1 em.rot{display:grid;overflow:hidden;margin-bottom:6px;font-style:normal;padding:.04em 0 .1em}
.rot b{grid-area:1/1;font-weight:inherit;color:var(--red);text-shadow:0 0 36px rgba(225,29,46,.5);white-space:nowrap;opacity:0;transform:translateX(70%);filter:blur(6px);transition:transform .75s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .6s}
.rot b.on{opacity:1;transform:none;filter:none}.rot b.out{opacity:0;transform:translateX(-70%);filter:blur(6px)}
.rd{display:flex;gap:8px;margin-top:18px;opacity:0;animation:fade .8s .9s forwards}.rd i{position:relative;width:34px;height:3px;background:#ffffff30;overflow:hidden;border-radius:2px}
.rd i.on:after{content:"";position:absolute;inset:0;background:var(--red);transform-origin:left;animation:bar 2.4s linear forwards}@keyframes bar{from{transform:scaleX(0)}to{transform:none}}
.hero p{margin:22px 0 30px;max-width:46ch;color:#ddd;opacity:0;animation:fade .8s .6s forwards}.hero .cta{display:flex;gap:14px;flex-wrap:wrap;opacity:0;animation:fade .8s .8s forwards}
@keyframes up{to{transform:none}}@keyframes fade{to{opacity:1}}
.scroll{position:absolute;bottom:22px;left:50%;width:2px;height:46px;background:linear-gradient(var(--red),transparent);z-index:3;animation:sc 1.8s infinite}@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.hero>.hart{position:absolute;right:max(24px,6vw);top:50%;width:min(40vw,500px);max-width:none;aspect-ratio:1;margin-top:calc(min(40vw,500px)/-2);z-index:2;display:grid;place-items:center;opacity:0;animation:fade 1.2s .4s forwards}
.hart:before{content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,rgba(225,29,46,.4),transparent 68%);animation:pl2 4s ease-in-out infinite}@keyframes pl2{50%{transform:scale(1.16);opacity:.7}}
.hart .rg{position:absolute;inset:0;width:100%;height:100%}.rg circle{fill:none;stroke:var(--red);stroke-width:.7;stroke-dasharray:3 7;transform-origin:center;animation:rot 40s linear infinite}.rg .b{stroke:#fff;opacity:.35;stroke-dasharray:1 5;animation-duration:60s;animation-direction:reverse}@keyframes rot{to{transform:rotate(360deg)}}
.hart .fl{position:relative;width:100%;display:grid;place-items:center;animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-14px)}}
.hart img{width:54%;filter:drop-shadow(0 0 30px rgba(225,29,46,.55));transform:translate(calc(var(--mx,0)*16px),calc(var(--my,0)*16px));transition:transform .25s}
.lp{display:flex;width:fit-content;gap:10px;align-items:center;margin-top:26px;padding:8px 16px;border:1px solid #ffffff2a;border-radius:99px;font-size:14px;background:#ffffff14;opacity:0;animation:fade .8s 1s forwards;transition:border-color .3s}.lp:hover{border-color:var(--red)}.lp i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pl 1.2s infinite}
@media(max-width:860px){.hero>.hart{animation:none;opacity:.16;right:-12%;width:75vw;margin-top:-37vw}}
/* reveal */
.rv{opacity:0;transform:translateY(32px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*90ms)}.rv.in{opacity:1;transform:none}
/* events */
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px}.hrow .sub{margin-bottom:0}.more{color:var(--red);font-weight:600;white-space:nowrap}.more:hover{text-decoration:underline}
.evg{display:flex;gap:16px;height:min(60vh,540px)}
.ev{flex:1;min-width:0;position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#1c0709,#0b0b0f 70%);border:1px solid var(--line);display:flex;color:#fff;transition:flex .7s cubic-bezier(.2,.8,.2,1),border-color .3s,opacity .8s,transform .8s}
.ev.live{flex:1.6}.evg:hover .ev{flex:1}.evg .ev:hover{flex:1.8;border-color:var(--red)}
.ev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;transition:transform 1s,opacity .5s}.ev:hover img{transform:scale(1.07);opacity:.7}
.ev:before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 85% 0,rgba(225,29,46,.3),transparent 55%),linear-gradient(transparent 35%,#000c)}
.ev .gh{position:absolute;right:-10px;bottom:8px;z-index:1;font:900 clamp(60px,8vw,120px)/1 Orbitron;color:transparent;-webkit-text-stroke:1px #ffffff1f;white-space:nowrap;pointer-events:none;transition:.6s}.ev:hover .gh{-webkit-text-stroke-color:#e11d2e88;transform:translateX(-14px)}
.ei{position:relative;z-index:2;width:100%;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.ev h3{font-size:clamp(20px,2.3vw,32px);margin-bottom:12px}.ev .m{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:#ccc}.ev .m span+span:before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--red);margin-right:16px;vertical-align:middle}
.ar{position:absolute;right:24px;top:24px;z-index:2;font-size:14px;font-weight:600;color:#fff;background:var(--red);padding:6px 12px;border-radius:8px;opacity:0;transform:translateX(-10px);transition:.4s}.ev:hover .ar{opacity:1;transform:none}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
.ev.live:after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),transparent 0 72%,var(--red));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 4s linear infinite;z-index:3;pointer-events:none}@keyframes spin{to{--a:360deg}}
.tag{align-self:flex-start;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;background:#ffffff22;letter-spacing:.06em;text-transform:uppercase}
.tag.live{background:var(--red)}.tag.registering{background:#1f6b2a}.tag.upcoming{background:#ffffff1f}.tag.completed{background:#444}
.tag.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:6px;animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.2}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:30px;margin-top:20px}
.stat b{display:block;font:800 clamp(34px,5vw,68px)/1 Orbitron;color:var(--red)}.stat span{color:var(--mut)}
/* split */
.split{padding:0;display:grid;grid-template-columns:1fr 1fr}.split>div{padding:110px max(24px,5vw) 60px;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative}
.split .l{background:radial-gradient(circle at 80% 90%,#3a0509,#050506 60%)}.split .r{background:radial-gradient(circle at 78% 18%,#d3d3da,#aeaeb9 72%);color:#111;box-shadow:inset 0 0 150px rgba(5,5,6,.3)}.split .r:after{content:"";position:absolute;left:0;top:0;bottom:0;width:16%;background:linear-gradient(90deg,rgba(5,5,6,.6),transparent);pointer-events:none}
.split ul{list-style:none;padding:0;display:grid;gap:10px}.split li:before{content:"✓";color:var(--red);font-weight:900;margin-right:10px}
.split .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25;z-index:0}.split>div>*{position:relative;z-index:1}.split .art{font-size:140px;opacity:.12;position:absolute;right:30px;bottom:10px;font-family:Orbitron;font-style:italic;font-weight:900;color:var(--red)}
/* timeline */
.tl{--n:8;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);height:min(60vh,540px);margin-top:10px}
.tl .rail{position:absolute;top:50%;left:0;right:0;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,#ffffff40 0 8px,transparent 8px 16px);animation:dash 1s linear infinite}@keyframes dash{to{background-position:-16px 0}}
.tl .rail i{position:absolute;right:0;top:0;height:100%;width:0;background:linear-gradient(270deg,transparent,var(--red) 85%);box-shadow:0 0 14px var(--red)}
.tl .rail i:after{content:"";position:absolute;left:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 0 18px 6px var(--red)}
.tl .col{position:relative;min-width:0}
.tl .nd{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--bg);border:2px solid #fff;z-index:2;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1) calc(var(--i)*.2s + .3s),background .3s,border-color .3s,box-shadow .3s}.tl .col.in .nd{transform:scale(1)}
.tl .nd.lit{background:var(--red);border-color:var(--red);box-shadow:0 0 16px 2px var(--red)}
.tl .col.lv .nd{background:var(--red);border-color:var(--red);animation:ring 2s infinite}@keyframes ring{0%{box-shadow:0 0 0 0 rgba(225,29,46,.6)}100%{box-shadow:0 0 0 18px rgba(225,29,46,0)}}
.tl .col:before{content:"";position:absolute;left:50%;width:1px;height:26px;background:linear-gradient(#ffffff55,#ffffff10)}
.tl .col.up:before{bottom:50%;margin-bottom:8px}.tl .col.dn:before{top:50%;margin-top:8px}
.tl .it{position:absolute;left:50%;width:170%;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 6px;isolation:isolate;transition:transform .4s}
.tl .col.up .it{bottom:calc(50% + 36px)}.tl .col.dn .it{top:calc(50% + 36px)}
.tl .col.up:hover .it{transform:translate(-50%,-6px)}.tl .col.dn:hover .it{transform:translate(-50%,6px)}
.tl .idx{position:absolute;z-index:-1;top:-18px;font:900 60px/1 Orbitron;color:transparent;-webkit-text-stroke:1px #ffffff16}
.tl .dt{font:600 12px Orbitron;letter-spacing:.08em;color:var(--red)}
.tl h3{font-size:clamp(13px,1.25vw,17px);line-height:1.25;transition:color .3s}.tl .col:hover h3,.tl .col.lit h3{color:#fff}.tl .col.lv h3{color:var(--red)}
@media(max-width:900px){.tl{height:auto;grid-template-columns:1fr;gap:28px;padding-left:38px}
.tl .rail{top:0;bottom:0;left:10px;right:auto;width:2px;height:auto;margin:0;background:repeating-linear-gradient(180deg,#ffffff40 0 8px,transparent 8px 16px);animation:dashv 1s linear infinite}
.tl .rail i{left:0;right:0;top:auto;bottom:0;width:100%;height:0;background:linear-gradient(0deg,transparent,var(--red) 85%)}.tl .rail i:after{left:50%;top:-6px;margin:0 0 0 -6px}
.tl .col:before,.tl .idx{display:none}.tl .nd{left:-35px;top:6px;margin:0}
.tl .it,.tl .col.up:hover .it,.tl .col.dn:hover .it{position:static;transform:none;width:auto;text-align:left;align-items:flex-start;padding:0}}
@keyframes dashv{to{background-position:0 -16px}}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(150px,24vh);gap:14px}
.gal figure{border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(135deg,#3b0a10,#14141a);cursor:zoom-in}.gal figure:nth-child(1),.gal figure:nth-child(6){grid-column:span 2;grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.gal figure:hover img{transform:scale(1.08)}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;background:linear-gradient(transparent,#000c);font-size:14px;transform:translateY(100%);transition:.3s}.gal figure:hover figcaption{transform:none}
.lb{position:fixed;inset:0;background:#000e;z-index:90;display:none;place-items:center}.lb.on{display:grid}.lb img{max-width:92vw;max-height:88vh;border-radius:10px}
/* team */
.tsec{background:radial-gradient(circle at 12% 8%,rgba(225,29,46,.16),transparent 45%),var(--bg)}
.tsec:before{content:"TEAM";position:absolute;right:-1vw;top:6vh;font:900 clamp(120px,22vw,340px)/1 Orbitron;color:transparent;-webkit-text-stroke:1px #ffffff12;pointer-events:none}
.team{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;position:relative;z-index:1}
.mem{position:relative;height:clamp(190px,30vh,290px);border-radius:14px;overflow:hidden;background:#0d0d11;border:1px solid var(--line);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1),border-color .4s,box-shadow .4s}
.mem .ph{clip-path:inset(100% 0 0 0);transition:clip-path 1s cubic-bezier(.2,.8,.2,1) calc(var(--i)*80ms)}.mem.in .ph{clip-path:inset(0 0 0 0)}
.mem:hover{border-color:var(--red);box-shadow:0 22px 50px -12px rgba(225,29,46,.4)}
.mem .ph{position:absolute;inset:0;background:linear-gradient(160deg,#3b0a10,#0b0b0f 72%);display:grid;place-items:center}
.mem .ph b{font:900 72px Orbitron;color:#ffffff1f}
.mem .ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transform:scale(1.02);transition:filter .6s,transform .8s}
.mem .ph img.wm{width:46%;height:auto;object-fit:contain;opacity:.2;transform:none}.mem:hover .ph img.wm{opacity:.4;filter:none}
.mem:hover .ph img{filter:none;transform:scale(1.08)}.mem:hover .ph img.wm{transform:scale(1.06)}
.mem:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 42%,#000e)}
.mem:after{content:"";position:absolute;inset:8px;border:1px solid transparent;border-radius:9px;z-index:3;pointer-events:none;transition:.4s}.mem:hover:after{border-color:#e11d2e99;inset:6px}
.mem .ix{position:absolute;top:12px;left:14px;z-index:2;font:900 22px/1 Orbitron;color:transparent;-webkit-text-stroke:1px #ffffff55}
.mem .inf{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 14px 14px}
.mem .inf:before{content:"";display:block;width:0;height:2px;background:var(--red);margin-bottom:10px;transition:width .5s}.mem:hover .inf:before{width:38px}
.mem .inf p{color:var(--red);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.mem .inf h3{font-size:15px}
.mem .ct{display:inline-block;max-height:0;overflow:hidden;opacity:0;font-size:12px;font-weight:600;background:var(--red);padding:0 12px;border-radius:6px;transition:.4s}.mem:hover .ct{max-height:30px;padding:5px 12px;margin-top:10px;opacity:1}
/* sponsors + join */
.spons{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#0f0f14,#09090c)}
.spons a{position:relative;min-height:190px;display:grid;place-items:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;color:#fff;font:800 clamp(20px,2.6vw,34px) Orbitron;letter-spacing:.04em;overflow:hidden}
.spons a:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(225,29,46,.38),transparent 65%);opacity:0;transition:opacity .5s}
.spons a:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--red);transform:scaleX(0);transition:transform .5s}
.spons a:hover:before{opacity:1}.spons a:hover:after{transform:none}
.spons a>*{position:relative;z-index:1;opacity:.92;transition:transform .5s,opacity .5s,filter .5s}.spons a:hover>*{transform:scale(1.08);opacity:1}
.spons img{box-sizing:content-box;max-height:56px;max-width:68%;object-fit:contain;background:#fff;padding:12px 18px;border-radius:10px;filter:grayscale(1)}.spons a:hover img{filter:none}
.tick{overflow:hidden;margin-top:44px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.tick div{display:flex;gap:56px;width:max-content;animation:mq 32s linear infinite}
.tick span{font:900 clamp(40px,6vw,84px)/1 Orbitron;color:transparent;-webkit-text-stroke:1.5px #ffffffd9;white-space:nowrap;transition:.3s}.tick a:nth-child(even) span{-webkit-text-stroke-color:#e11d2e}
@keyframes mq{to{transform:translateX(-50%)}}
.join{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:60px}.join h2{justify-content:center}.join h2:before{display:none}.join h2 em{color:var(--red)}
.words{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;color:#ddd}.words span+span:before{content:"•";color:var(--red);margin-right:18px}
footer{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:30px;border-top:1px solid var(--red);padding-top:30px;font-size:14px}footer h4{margin-bottom:10px}footer a{display:block;color:var(--mut);padding:2px 0}footer a:hover{color:#fff}
.copy{margin-top:26px;color:var(--mut);font-size:13px}
#glow{position:fixed;left:0;top:0;width:560px;height:560px;border-radius:50%;pointer-events:none;z-index:0;transform:translate3d(-999px,-999px,0);will-change:transform;background:radial-gradient(circle,rgba(225,29,46,.14),transparent 65%)}
#dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:40}#dots a{width:7px;height:7px;border-radius:50%;background:#8888;transition:.3s}#dots a.on{background:var(--red);transform:scale(1.7);box-shadow:0 0 12px var(--red)}
.mem h3 a:hover{color:var(--red)}
@media(max-width:1180px){.links{gap:14px}.links a{font-size:13px}}
@media(max-width:860px){.evg{flex-direction:column;height:auto}.ev{min-height:210px;flex:none!important}.hrow{flex-direction:column;align-items:flex-start}#dots{display:none}}
@media(max-width:1100px){.team{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.team{grid-template-columns:repeat(2,1fr)}}
.hero.off *{animation:none!important}
.s.hero{padding-left:max(24px,4vw)}.hero>div:not(.hart){max-width:min(600px,54vw)}
@media(max-width:860px){.hero>div:not(.hart){max-width:100%}}
@media(prefers-reduced-motion:reduce){.tick div{animation:mq 60s linear infinite!important}}
.alink{font:500 11px Inter,sans-serif;color:var(--mut);background:none;border:1px solid #ffffff22;border-radius:6px;padding:2px 9px;margin-left:6px;cursor:pointer;opacity:.6;transition:.3s}.alink:hover{opacity:1;color:#fff;border-color:var(--red)}
#lg{position:fixed;inset:0;z-index:150;background:#000d;display:none;place-items:center;padding:20px}#lg.on{display:grid}
#lg .bx{width:min(380px,100%);background:#0b0b0e;border:1px solid var(--red);border-radius:16px;padding:28px;display:grid;gap:14px;box-shadow:0 0 60px rgba(225,29,46,.25);animation:fade .4s forwards}
#lg h3{font-size:20px}#lg input{width:100%;background:#17171d;border:1px solid #33333b;color:#fff;border-radius:8px;padding:12px;font:15px Inter,sans-serif}#lg input:focus{outline:2px solid var(--red)}#lg .er{color:#ff6b78;font-size:13px;min-height:18px}#lg .row{display:flex;gap:10px}
.tick a{display:flex;align-items:center}.tick img{height:64px;box-sizing:content-box;background:#fff;padding:12px 22px;border-radius:12px;filter:grayscale(1);opacity:.9;transition:.3s}.tick a:hover img{filter:none;opacity:1}.tick+.tick{margin-top:26px}.tick.rev div{animation-direction:reverse;animation-duration:44s}
@media(prefers-reduced-motion:reduce){.tick.rev div{animation-direction:reverse!important}}
.sbtn{display:flex;justify-content:center;margin-top:48px}.sbtn .btn{flex-direction:column;gap:1px;padding:8px 22px;font-size:13px;border-radius:7px;align-items:center;text-align:center}.sbtn small{font-weight:400;font-size:11.5px;opacity:.9;word-break:break-all}
@media(max-width:1100px){.links{display:none;position:absolute;top:100%;left:0;right:0;background:#050506f2;flex-direction:column;padding:16px 24px;gap:12px}.links.open{display:flex}.burger{display:block}}
.inst{display:flex;align-items:center;gap:14px}.inst a{display:block}.inst img{height:46px;width:auto;display:block;opacity:.95;transition:.3s}.inst a:hover img{opacity:1;transform:scale(1.06)}.inst a+a{padding-left:14px;border-left:1px solid #ffffff30}

/* admin */
#adm{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#0b0b0e;border-left:1px solid var(--red);z-index:100;transform:translateX(105%);transition:.35s;display:flex;flex-direction:column;color:#fff}#adm.on{transform:none}
#adm header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}#adm header b{flex:1}
